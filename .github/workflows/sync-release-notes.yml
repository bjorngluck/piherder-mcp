# Keep a GitHub Release body in sync with docs/RELEASE_vX.Y.Z.md on main.
# The tag already published v0.2.0 from generated commit notes. Pushing the
# notes file updates that body without moving the tag.
name: Sync release notes

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag / release to update (e.g. v0.2.0)"
        required: true
        default: "v0.2.0"
      notes_path:
        description: "Path to release notes markdown"
        required: true
        default: "docs/RELEASE_v0.2.0.md"
  push:
    branches: [main]
    paths:
      - "docs/RELEASE_*.md"
      - ".github/workflows/sync-release-notes.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Update GitHub Release notes body
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          update_one() {
            local TAG="$1"
            local NOTES="$2"
            test -f "$NOTES"
            if ! gh release view "$TAG" >/dev/null 2>&1; then
              echo "No GitHub Release for $TAG — skip."
              return 0
            fi
            gh release edit "$TAG" --notes-file "$NOTES"
            echo "Updated release $TAG from $NOTES"
          }

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            update_one "${{ inputs.tag }}" "${{ inputs.notes_path }}"
            exit 0
          fi

          FILES="$(git diff --name-only HEAD^ HEAD -- 'docs/RELEASE_*.md' || true)"
          if [ -z "$FILES" ]; then
            FILES="$(git ls-files 'docs/RELEASE_*.md')"
          fi
          for NOTES in $FILES; do
            base="$(basename "$NOTES" .md)"
            TAG="${base#RELEASE_}"
            update_one "$TAG" "$NOTES"
          done
