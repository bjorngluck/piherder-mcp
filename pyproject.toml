[project]
name = "piherder-mcp"
version = "0.1.0"
description = "stdio MCP adapter for the PiHerder token API"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Bjorn Gluck" }]
dependencies = [
  "mcp>=2,<3",
  "httpx2>=2.5",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
piherder-mcp = "piherder_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
