[project]
name = "piherder-mcp"
version = "0.1.1"
description = "stdio MCP adapter for the PiHerder token API"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Bjorn Gluck" }]
keywords = [
  "mcp",
  "model-context-protocol",
  "piherder",
  "stdio",
  "fleet",
  "ops",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Systems Administration",
  "Typing :: Typed",
]
dependencies = [
  "mcp>=2,<3",
  "httpx2>=2.5",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/bjorngluck/piherder-mcp"
Repository = "https://github.com/bjorngluck/piherder-mcp"
Issues = "https://github.com/bjorngluck/piherder-mcp/issues"
Changelog = "https://github.com/bjorngluck/piherder-mcp/blob/main/CHANGELOG.md"
Documentation = "https://github.com/bjorngluck/piherder/blob/v1.7.0-dev/wiki/operations/mcp.md"
"PiHerder" = "https://github.com/bjorngluck/piherder"

[project.scripts]
piherder-mcp = "piherder_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
